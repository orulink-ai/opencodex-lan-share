# opencodex LAN Share - Client Configuration Template
# This file is used by setup-client.ps1 / setup-client.sh
# Variables are replaced at setup time:
#   {SERVER_IP}   - LAN IP of the opencodex server machine
#   {PORT}        - Proxy port (default: 10101)
#   {ACCESS_KEY}  - Your personal access key
#
# === REQUIREMENT: opencodex must be installed on the client machine ===
# The setup script auto-installs it via: npm install -g @bitkyc08/opencodex
# Verify: ocx --version

# === REQUIRED: Route through the LAN proxy ===
base_url = "http://{SERVER_IP}:{PORT}/v1"

# === Provider configuration (opencodex-specific) ===
model_provider = "opencodex"
wire_api = "responses"

# === Provider section ===
[model_providers.opencodex]
name = "OpenCodex Proxy ({SERVER_IP})"
base_url = "http://{SERVER_IP}:{PORT}/v1"
wire_api = "responses"
requires_openai_auth = true

# === NOTES ===
# - opencodex must be installed (npm install -g @bitkyc08/opencodex)
# - The proxy forwards your access key (no separate API key needed)
# - All provider API keys (qwen-cloud, deepseek) stay on the server machine
# - Models with prefix qwen-cloud/* and deepseek/* use the server's API keys
# - OPENAI_API_KEY env var must be set to your access key
